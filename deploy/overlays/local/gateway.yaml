# The environment-specific half of the Gateway API split: HTTPRoutes live in
# base and are identical everywhere; the Gateway (controller, hostnames, TLS)
# is per-overlay. Prod gets gatewayClassName: gke-l7-global-external-managed.
#
# admin has no listener and no HTTPRoute by design — in every environment it
# is reached by port-forward only (Tilt's localhost:3001 locally, `kubectl
# port-forward svc/admin` in prod), mirroring the old GCE IAP-tunnel posture.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: palladium
spec:
  gatewayClassName: cilium
  listeners:
    # Browsers hit these hosts as …:8081 (see the gateway-forward resource in
    # the Tiltfile). Gateway API hostname matching ignores the port in the
    # Host header, so the listeners match unchanged.
    - name: api
      protocol: HTTP
      port: 80
      hostname: api.palladium.local
    - name: commerce
      protocol: HTTP
      port: 80
      hostname: commerce.palladium.local
