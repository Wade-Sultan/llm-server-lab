apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: palladium
  annotations:
    # SSE: without these the builder's /chat stream is buffered and the client
    # sees nothing until the whole response completes. The read timeout must
    # clear _DSPY_CHAT_TIMEOUT_S (180s) or nginx cuts a long build off.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    # Host-based routing mirrors the prod topology, so the only thing that
    # changes between local and GKE is the hostnames themselves.
    - host: api.palladium.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: builder
                port:
                  name: http
    - host: commerce.palladium.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: commerce
                port:
                  name: http
    - host: admin.palladium.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  name: http
