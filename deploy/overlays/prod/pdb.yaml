# builder only, and only because it runs 2+ replicas.
#
# There is deliberately NO PDB for commerce or admin. At 1 replica
# minAvailable: 1 permits zero voluntary disruptions, which does not protect
# them — it blocks node drains, stalls Autopilot's node upgrades, and ends with
# the pod force-evicted after the grace window anyway. The outage still happens,
# it just arrives with a jammed upgrade attached.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: builder
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: builder
---
# The worker qualifies on the same 2-replica grounds. It matters slightly less
# than builder's — a drained worker's in-flight turns are redelivered rather
# than lost — but "redelivered" still means the user watches their build stall
# for the redelivery backoff, so keeping one pod pulling through a node drain is
# worth the same protection.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: worker
