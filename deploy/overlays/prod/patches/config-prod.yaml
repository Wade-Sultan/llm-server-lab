apiVersion: v1
kind: ConfigMap
metadata:
  name: builder-config
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  # POSTGRES_SERVER is deliberately ABSENT here. Do not add it back.
  #
  # It is the Cloud SQL private IP, which must not be committed, so it is
  # supplied through palladium-secrets-builder instead — created out-of-band from
  # the live instance (RUNBOOK §7). Reached directly over the VPC: Autopilot
  # clusters are VPC-native, so no Auth Proxy sidecar is needed.
  #
  # This works because envFrom lists the configMapRef first and the secretRef
  # second, so the Secret contributes the key with nothing to conflict with. The
  # field is REQUIRED — `POSTGRES_SERVER: str` in backend/app/core/config.py has
  # no default — so if the Secret omits it, builder fails pydantic validation on
  # startup rather than falling back to anything.
  #
  # The `credentials` step in deploy/cloudbuild.yaml asserts the Secret exists
  # and that the value is an RFC1918 address before any rollout.
  #
  # The real database on Cloud SQL. Local uses `palladium_local` so the two are
  # never confusable in a connection string.
  POSTGRES_DB: "palladium"
  FRONTEND_HOST: "https://palladiumtech.ai"
  # No ports and no localhost, unlike local: browsers send the origin without a
  # port for :443, so the portless form is the one that matches. k8s-api is
  # included for the Phase 4 parallel run and can be dropped at cutover.
  BACKEND_CORS_ORIGINS: "https://palladiumtech.ai,https://www.palladiumtech.ai,https://k8s-api.palladiumtech.ai"
  # The FRONTEND Firebase project (the ID token's audience), not the GCP
  # project. Same value as local because the frontend project is shared; a
  # mismatch surfaces as invalid-credential on every authenticated request.
  FIREBASE_PROJECT_ID: "project-b8abf13d-d1ce-43f1-837"
  # --- Valkey / Pub/Sub -----------------------------------------------------
  # VALKEY_HOST is deliberately ABSENT here, for the same reason as
  # POSTGRES_SERVER above: it is the Memorystore instance's private VPC address
  # and does not belong in git. It comes from palladium-secrets-builder
  # (deploy/messaging.md §1).
  #
  # Unlike POSTGRES_SERVER, an absent VALKEY_HOST does NOT fail startup — it
  # defaults to "" and degrades /chat to inline streaming. That is the right
  # default for local development and the wrong state for production, so
  # cloudbuild.yaml's credentials step warns when the key is missing.
  VALKEY_PORT: "6379"
  # FALSE, and this must stay in step with how the instance was created. Prod
  # runs a `custom-pico` node, which Google sells on Cluster Mode Disabled
  # instances only — so there is no CLUSTER SLOTS to read and a RedisCluster
  # client would fail at connect.
  #
  # custom-pico over shared-core-nano deliberately: nano is marginally larger
  # (1.12 GB vs 1.08 GB) but has 0.5 shared vCPU and **no SLA**, and Google
  # documents it as development-only. pico gives 2 dedicated vCPU and an SLA at
  # essentially the same memory. Memory was never the constraint here — the
  # working set is TTL'd stream entries — so trading a rounding error of RAM for
  # dedicated cores and a support commitment is the right way round.
  VALKEY_CLUSTER: "false"
  # Memorystore for Valkey only accepts TLS if the instance was created with
  # in-transit encryption; it cannot be enabled afterwards. Keep this in step
  # with how the instance was actually provisioned or every command times out
  # on a handshake that never completes.
  VALKEY_TLS: "false"
  PUBSUB_TOPIC: "chat-turns"
  PUBSUB_SUBSCRIPTION: "chat-turns-workers"
  # 8 concurrent turns per worker pod at 2 replicas = 16 in flight. Raise this
  # before raising replicas: turns are OpenRouter-bound, so a pod at 8 is mostly
  # idle, and more pods cost Autopilot capacity that concurrency does not.
  PUBSUB_MAX_CONCURRENCY: "8"
  # Comfortably above _DSPY_CHAT_TIMEOUT_S (180s) so a slow-but-healthy build is
  # never redelivered underneath itself.
  PUBSUB_ACK_EXTENSION_S: "600"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: commerce-config
data:
  ENV: "production"
  FRONTEND_HOST: "https://palladiumtech.ai"
  BACKEND_CORS_ORIGINS: "https://palladiumtech.ai,https://www.palladiumtech.ai"
  FIREBASE_PROJECT_ID: "project-b8abf13d-d1ce-43f1-837"
