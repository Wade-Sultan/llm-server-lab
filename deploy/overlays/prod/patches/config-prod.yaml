apiVersion: v1
kind: ConfigMap
metadata:
  name: builder-config
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  # POSTGRES_SERVER is deliberately ABSENT here. Do not add it back.
  #
  # It is the Cloud SQL private IP, which must not be committed, so it is
  # supplied through palladium-secrets-builder instead — created out-of-band from
  # the live instance (RUNBOOK §7). Reached directly over the VPC: Autopilot
  # clusters are VPC-native, so no Auth Proxy sidecar is needed.
  #
  # This works because envFrom lists the configMapRef first and the secretRef
  # second, so the Secret contributes the key with nothing to conflict with. The
  # field is REQUIRED — `POSTGRES_SERVER: str` in backend/app/core/config.py has
  # no default — so if the Secret omits it, builder fails pydantic validation on
  # startup rather than falling back to anything.
  #
  # The `credentials` step in deploy/cloudbuild.yaml asserts the Secret exists
  # and that the value is an RFC1918 address before any rollout.
  #
  # The real database on Cloud SQL. Local uses `palladium_local` so the two are
  # never confusable in a connection string.
  POSTGRES_DB: "palladium"
  FRONTEND_HOST: "https://palladiumtech.ai"
  # No ports and no localhost, unlike local: browsers send the origin without a
  # port for :443, so the portless form is the one that matches. k8s-api is
  # included for the Phase 4 parallel run and can be dropped at cutover.
  BACKEND_CORS_ORIGINS: "https://palladiumtech.ai,https://www.palladiumtech.ai,https://k8s-api.palladiumtech.ai"
  # The FRONTEND Firebase project (the ID token's audience), not the GCP
  # project. Same value as local because the frontend project is shared; a
  # mismatch surfaces as invalid-credential on every authenticated request.
  FIREBASE_PROJECT_ID: "project-b8abf13d-d1ce-43f1-837"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: commerce-config
data:
  ENV: "production"
  FRONTEND_HOST: "https://palladiumtech.ai"
  BACKEND_CORS_ORIGINS: "https://palladiumtech.ai,https://www.palladiumtech.ai"
  FIREBASE_PROJECT_ID: "project-b8abf13d-d1ce-43f1-837"
