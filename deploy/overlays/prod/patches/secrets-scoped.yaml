# Per-service secret scoping, restoring the property the Cloud Run setup had:
# a service can only read the credentials it actually uses. Base references a
# single `palladium-secrets` (which is right for local — one dev database, one
# throwaway key set); prod splits it three ways.
#
# envFrom is a list with no patchMergeKey, so a strategic merge patch REPLACES
# it rather than appending. That is why each container below re-states its
# configMapRef: omitting it would silently drop every non-secret env var.
#
# YOUR EDITOR WILL FLAG "spec.selector is required" ON THE FOUR DEPLOYMENTS
# BELOW. That is a false positive and the field must NOT be added. These are
# strategic merge patches, not manifests: they carry only the fields being
# overridden, and the selector comes from base. Adding one here would duplicate
# a value that is IMMUTABLE on a live Deployment, so any later divergence
# between this file and base becomes a hard apply failure — the same trap the
# `includeSelectors` note in deploy/base/kustomization.yaml describes.
#
# Only Deployments are flagged (4, not 11): spec.selector is required on
# Deployment in the Kubernetes schema and optional on Job and CronJob.
#
# EVERY BUILDER-IMAGE WORKLOAD MUST APPEAR BELOW, and the failure mode when one
# does not is silent in CI and total at runtime. Base points each of them at
# `palladium-secrets`, which exists only in the local overlay — prod has the
# three scoped Secrets and no secretGenerator (see kustomization.yaml). A
# workload this file forgets therefore renders, applies, and schedules cleanly,
# then wedges in CreateContainerConfigError because the kubelet cannot resolve
# a secretRef that was never marked optional. Nothing reports it: there is no
# rollout to fail, and for a CronJob the only evidence is an hourly Job that
# never produces a log line.
#
# telemetry-drain was exactly that. It was added on 2026-08-16, eighteen days
# after this file, and was never listed here — so the GEPA-dataset backstop had
# never once run in prod. `deploy/cloudbuild.yaml`'s render step now greps the
# rendered manifests for a bare `palladium-secrets` and fails the build, so the
# next omission is caught before it deploys rather than after.
#
# Key ownership was derived from the code, not assumed:
#   builder   POSTGRES_SERVER POSTGRES_PASSWORD POSTGRES_DB_URL OPENROUTER_API_KEY
#             SERPAPI_KEY TAVILY_API_KEY DISCOVERY_API_KEY HF_TOKEN
#             OPENAI_API_KEY COMMERCE_INTERNAL_KEY
#
# OPENAI_API_KEY is builder-only and is NOT the same credential as
# OPENROUTER_API_KEY: OpenRouter proxies chat completions and has no embeddings
# endpoint, so app/services/embeddings/client.py calls OpenAI directly. The
# embeddings and benchmarks CronJobs below read it from this same Secret.
#
# POSTGRES_SERVER is in the Secret rather than builder-config because it is the
# Cloud SQL private IP, which must not be committed. commerce and admin do not
# need it — their DATABASE_URL already embeds the host.
#   commerce  DATABASE_URL RESEND_API_KEY AMAZON_ASSOCIATE_TAG EBAY_CAMPAIGN_ID
#             INTERNAL_API_KEY
#   admin     DATABASE_URL DISCOVERY_API_KEY
#
# Two keys are deliberately in more than one place, because both services really
# do read them: DISCOVERY_API_KEY (admin calls builder's discovery endpoint with
# it) and DATABASE_URL (commerce via pgx, admin via Prisma).
#
# A third pair is the same secret under two names: the builder's
# COMMERCE_INTERNAL_KEY and commerce's INTERNAL_API_KEY must hold the SAME value
# — it is one shared secret, named from each side (the pricing ETL calls
# commerce's /internal/v1/price-alerts with it so price-drop emails are sent by
# the one service that holds RESEND_API_KEY). The names differ because each is
# the natural name in its own service: commerce guards "the internal API", the
# builder holds "the key for commerce". If they drift apart, alerts fail with a
# 403 from commerce and the subscriptions stay active for the next run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: builder
spec:
  template:
    spec:
      containers:
        - name: builder
          envFrom:
            - configMapRef:
                name: builder-config
            - secretRef:
                name: palladium-secrets-builder
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce
spec:
  template:
    spec:
      containers:
        - name: commerce
          envFrom:
            - configMapRef:
                name: commerce-config
            - secretRef:
                name: palladium-secrets-commerce
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
spec:
  template:
    spec:
      containers:
        - name: admin
          envFrom:
            - configMapRef:
                name: admin-config
            - secretRef:
                name: palladium-secrets-admin
---
# The worker runs the same pipeline as builder from the same image, so it needs
# the same keys — plus VALKEY_HOST and VALKEY_PASSWORD, which live in this
# Secret rather than builder-config because they are a private VPC address and a
# credential.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  template:
    spec:
      containers:
        - name: worker
          envFrom:
            - configMapRef:
                name: builder-config
            - secretRef:
                name: palladium-secrets-builder
---
# The three builder-image workloads get the builder secret. migrate needs only
# the database keys, but it runs `alembic upgrade head` from the same image and
# app config, which imports settings that expect the full set.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  template:
    spec:
      containers:
        - name: alembic
          envFrom:
            - configMapRef:
                name: builder-config
            - secretRef:
                name: palladium-secrets-builder
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pricing-etl
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: etl
              envFrom:
                - configMapRef:
                    name: builder-config
                - secretRef:
                    name: palladium-secrets-builder
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: discovery
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: discovery
              envFrom:
                - configMapRef:
                    name: builder-config
                - secretRef:
                    name: palladium-secrets-builder
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: embeddings
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: embeddings
              envFrom:
                - configMapRef:
                    name: builder-config
                - secretRef:
                    name: palladium-secrets-builder
---
# Runs the builder image purely to POST to commerce, so it needs
# COMMERCE_INTERNAL_URL (builder-config) and COMMERCE_INTERNAL_KEY (the Secret)
# and nothing else — but it boots app.core.config, which validates the full set.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: listing-digest
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: digest
              envFrom:
                - configMapRef:
                    name: builder-config
                - secretRef:
                    name: palladium-secrets-builder
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: benchmarks
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: benchmarks
              envFrom:
                - configMapRef:
                    name: builder-config
                - secretRef:
                    name: palladium-secrets-builder
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: telemetry-drain
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: telemetry-drain
              envFrom:
                - configMapRef:
                    name: builder-config
                - secretRef:
                    name: palladium-secrets-builder
