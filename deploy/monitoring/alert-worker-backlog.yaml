# Turns are arriving faster than the workers can run them.
#
# THE SYMPTOM USERS ACTUALLY FEEL. A backlog does not error — every turn still
# completes and still persists — it just adds queue time in front of a build
# that already takes up to 180 seconds. The user experiences it as the app
# getting slow, with nothing in the API's own latency metrics to show for it,
# because builder answers POST /chat immediately either way.
#
# BACKLOG DEPTH IS THE WEAKER SIGNAL and comes second here for a reason: 20
# queued turns is fine if they drain in a minute and terrible if they do not.
# Oldest-unacked-age measures the wait directly, which is why it gets the
# tighter threshold.
displayName: "Palladium — chat turn backlog"
documentation:
  mimeType: text/markdown
  content: |
    Turns are queuing on `chat-turns-workers` faster than the worker pool drains
    them. Builds still complete; they just wait first.

    **Check current capacity:**

    ```
    kubectl -n palladium get pods -l app=worker
    kubectl -n palladium logs -l app=worker --tail=50 | grep -c 'published\|turn '
    ```

    **Raise concurrency before raising replicas.** Turns are blocked on
    OpenRouter, not on CPU, so a worker at `PUBSUB_MAX_CONCURRENCY=8` is mostly
    idle. Doubling the setting in
    `deploy/overlays/prod/patches/config-prod.yaml` costs nothing on Autopilot;
    doubling replicas costs a pod. The ceiling is memory (each in-flight turn
    holds a DSPy state) and OpenRouter's own rate limits — not cores.

    **If concurrency is already high**, the answer is more replicas, and at that
    point backlog-based autoscaling (KEDA) is worth the setup rather than
    hand-editing a replica count. The CPU-based HPA that builder uses will not
    work here for the same reason it understates builder's own load — see the
    note at the bottom of `deploy/overlays/prod/hpa.yaml`.

    **A sudden backlog with no traffic change** usually means the workers are
    not pulling at all: check for `Valkey unreachable` or a crash loop before
    scaling anything.
combiner: OR
conditions:
  - displayName: "oldest queued turn is waiting too long"
    conditionThreshold:
      filter: >-
        resource.type = "pubsub_subscription"
        AND resource.labels.subscription_id = "chat-turns-workers"
        AND metric.type = "pubsub.googleapis.com/subscription/oldest_unacked_message_age"
      comparison: COMPARISON_GT
      # 120s of queue time, on top of a build that can legitimately take 180s.
      # Deliberately well below the 600s ack deadline: past that a turn is
      # redelivered, and by then the user has almost certainly given up.
      thresholdValue: 120
      duration: 300s
      trigger:
        count: 1
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_MAX
          crossSeriesReducer: REDUCE_MAX

  - displayName: "backlog depth is growing"
    conditionThreshold:
      filter: >-
        resource.type = "pubsub_subscription"
        AND resource.labels.subscription_id = "chat-turns-workers"
        AND metric.type = "pubsub.googleapis.com/subscription/num_undelivered_messages"
      comparison: COMPARISON_GT
      # 2 replicas x 8 concurrent = 16 in flight. 32 is two full rounds queued
      # behind what is already running — real congestion, not a burst.
      thresholdValue: 32
      duration: 600s
      trigger:
        count: 1
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_MAX
          crossSeriesReducer: REDUCE_MAX
alertStrategy:
  # Six hours. Backlog is self-resolving once traffic drops, and a stale open
  # incident from last night's spike is noise.
  autoClose: 21600s
enabled: true
notificationChannels: []
