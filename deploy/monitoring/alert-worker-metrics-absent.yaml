# The workers stopped reporting.
#
# THIS ONE GUARDS THE OTHER ALERTS. A threshold condition on a metric that is no
# longer being written does not fire — it goes quiet, which reads identically to
# healthy. So without this policy, the two failure modes that matter most are
# also the two most likely to silence their own alarms:
#
#   - every worker pod is down or crash-looping (nothing runs turns, and
#     "buffers accumulating" reports nothing because nothing is scanning)
#   - Valkey is unreachable (count_retained() returns None, so the gauge is
#     never set, and turns silently fall back to the inline path)
#
# `palladium_chat_buffers_retained` is the right metric to watch for absence
# specifically because it is written unconditionally on a 60s timer rather than
# per turn. A traffic-driven metric would look absent during any quiet hour and
# would have to be threshold-tuned against usage patterns instead.
#
# IT IS NO LONGER A WORKER-ONLY METRIC, and that change is what keeps this
# policy honest now that keda-worker.yaml runs the pool at minReplicaCount 0.
# An empty worker Deployment is the expected steady state between bursts, so a
# gauge written only by worker pods would go absent on every quiet stretch and
# page for a perfectly healthy idle cluster — the exact false positive this
# metric was chosen to avoid. The loop therefore runs in the API too
# (app/main.py's lifespan, via app/services/chat_buffer.py), and builder never
# drops below 2 replicas.
#
# So read this alert as "nothing anywhere is reaching Valkey" rather than "the
# workers are down". Both original failure modes still reach it: Valkey
# unreachable silences every pod at once, and a worker outage now shows up as a
# backlog (alert-worker-backlog.yaml) rather than as silence — which is the
# correct division, because with scale-to-zero "no worker pods" and "broken" are
# no longer the same statement.
displayName: "Palladium — worker metrics absent"
documentation:
  mimeType: text/markdown
  content: |
    No pod — API or worker — has reported `palladium_chat_buffers_retained` for
    10 minutes. It is written on a fixed 60s timer by every builder replica and
    every running worker, so absence is never explained by low traffic, and it
    is not explained by the worker pool being scaled to zero either.

    **Treat the other chat-turn alerts as unreliable until this clears** — they
    are threshold conditions on metrics that are no longer arriving, so their
    silence means nothing right now.

    **Check, in order:**

    ```
    kubectl -n palladium get pods -l app=worker
    kubectl -n palladium logs -l app=worker --tail=50
    ```

    - **CrashLoopBackOff** — usually a missing `PUBSUB_SUBSCRIPTION` (the worker
      fails fast without it) or a bad image rollout.
    - **`Valkey unreachable`** — the PSC service connection policy or the
      Memorystore instance. `deploy/messaging.md` §1a. Note that the API keeps
      serving in this state by falling back to inline turns, so the site looks
      fine while durability is gone.
    - **Pods Running, no metrics** — the GMP scrape, not the worker. Check the
      PodMonitoring:
      `kubectl -n palladium describe podmonitoring worker`
    - **Zero worker pods** — EXPECTED when no turns are queued; KEDA runs this
      Deployment at a floor of 0. It is only a finding if turns are also
      backlogged, which is `alert-worker-backlog.yaml`'s job, not this one. If
      the pool is stuck at zero *with* a backlog, the scaler is the suspect:
      `kubectl -n palladium describe scaledobject worker` (a failed
      TriggerAuthentication leaves it inactive and says so only there), then
      check Autopilot capacity with `kubectl describe` on the ReplicaSet for
      FailedScheduling.
    - **Zero builder pods** — this is the real "nothing is reporting" case now.
      `kubectl -n palladium get pods -l app=builder`.
combiner: OR
conditions:
  - displayName: "no worker has reported in 10 minutes"
    conditionAbsent:
      filter: >-
        resource.type = "prometheus_target"
        AND metric.type = "prometheus.googleapis.com/palladium_chat_buffers_retained/gauge"
      # Ten sample intervals. Long enough that a rolling restart (maxUnavailable:
      # 0, so at least one pod is always up) never trips it, short enough to
      # catch a real outage before a shift's worth of turns go unpersisted.
      #
      # Unchanged by the worker's scale-to-zero floor precisely because builder
      # now writes the same gauge — see the header. If that ever stops being
      # true, no duration is long enough: an idle pool can last hours.
      duration: 600s
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_MEAN
          crossSeriesReducer: REDUCE_MAX
alertStrategy:
  autoClose: 604800s
enabled: true
notificationChannels: []
