apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Environment-independent shape only. Anything that differs between local and
# GKE — replica counts, DB endpoint, ingress class, resource ceilings — belongs
# in an overlay, never here.
#
# Note: labels are metadata only (includeSelectors defaults to false). Adding
# them to selectors would make the Deployments' selectors immutable-conflict on
# the first apply against an existing cluster.
labels:
  - pairs:
      app.kubernetes.io/part-of: palladium
    # Managed OpenTelemetry selects PODS, not Deployments. Without this the
    # label lands on Deployment metadata only, the Instrumentation CR in
    # deploy/observability.md §4d matches nothing, OTEL_EXPORTER_OTLP_ENDPOINT
    # is never injected, and tracing.py quietly skips the Google exporter —
    # with a green deploy and no error anywhere.
    #
    # Distinct from includeSelectors, which stays off for the reason above:
    # this adds a label to the pod template, it does not touch spec.selector.
    includeTemplates: true

resources:
  - builder/serviceaccount.yaml
  - builder/configmap.yaml
  - builder/deployment.yaml
  - builder/service.yaml
  - builder/httproute.yaml
  # No serviceaccount/service/httproute of its own: the worker reuses the
  # builder KSA (same Cloud SQL and Secret Manager grants, plus pubsub.subscriber)
  # and has nothing routing to it. See worker/deployment.yaml.
  - worker/deployment.yaml
  - commerce/serviceaccount.yaml
  - commerce/configmap.yaml
  - commerce/deployment.yaml
  - commerce/service.yaml
  - commerce/httproute.yaml
  - admin/serviceaccount.yaml
  - admin/configmap.yaml
  - admin/deployment.yaml
  - admin/service.yaml
  - jobs/migrate-job.yaml
  - jobs/pricing-etl-cronjob.yaml
  - jobs/discovery-cronjob.yaml
  - jobs/embeddings-cronjob.yaml
  - jobs/benchmarks-cronjob.yaml
  - jobs/listing-digest-cronjob.yaml
  - jobs/telemetry-drain-cronjob.yaml
