apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: builder
      containers:
        - name: alembic
          image: palladium/builder
          # Overrides the image CMD (which is server-only). Alembic is the sole
          # migration authority; Prisma in admin is a pure consumer of the
          # schema and must never own a migration.
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: builder-config
            - secretRef:
                name: palladium-secrets
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
# Deliberately a Job, never an initContainer: two builder replicas each running
# an init container means two concurrent `alembic upgrade head` racing.
#
# Job specs are immutable, so `kubectl apply` over a completed Job with a
# changed image fails. Prod suffixes the name with the git SHA; locally Tilt
# recreates it.
