apiVersion: batch/v1
kind: CronJob
metadata:
  name: discovery
spec:
  # Every third day at 06:00, i.e. 10-11 runs a month rather than one big one.
  #
  # WHY DISTRIBUTED. A single monthly sweep means a term someone asked for on
  # the 2nd waits four weeks, and it lands the whole month's search and
  # extraction spend in one window. Spreading it keeps the demand queue
  # (app/services/discovery/queue.py) draining continuously, so the catalog
  # tracks what users are actually asking for within days.
  #
  # WHY 06:00. It has to clear the daily jobs it would otherwise contend with
  # for Cloud SQL: pricing-etl at 04:00 and embeddings at 04:30. 05:00 is taken
  # by benchmarks on Sundays, so an hour after that is the first clean slot.
  #
  # KNOWN QUIRK: */3 restarts each month, so the 31st-to-1st gap is one day
  # rather than three. Harmless for a sweep; noted because it otherwise reads
  # as a scheduling bug in the run history.
  schedule: "0 6 */3 * *"
  timeZone: "America/Los_Angeles"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 0 retries: items are processed serially and each one costs LLM calls,
      # so a retry re-pays for everything that already succeeded. The job exits
      # 0 on partial failure for the same reason; per-item outcomes live on
      # their discovery_runs rows.
      backoffLimit: 0
      # DISCOVERY_MAX_ITEMS (25) items, each fetching and extracting up to 3
      # sources. Generous for that, and a hard stop if a fetch wedges.
      activeDeadlineSeconds: 5400
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: builder
          containers:
            - name: discovery
              image: palladium/builder
              command: ["python", "-m", "app.jobs.discovery"]
              envFrom:
                - configMapRef:
                    name: builder-config
                - secretRef:
                    name: palladium-secrets
              # Sized to what this job actually does: search, HTTP fetch and
              # LLM extraction, all network-latency bound. It holds one item's
              # documents in memory at a time. The 2 CPU / 8 GiB in the
              # original plan described a LlamaIndex RAG pipeline that does not
              # exist in this codebase — on Autopilot that would have been
              # billed idle every month.
              resources:
                requests:
                  cpu: "500m"
                  memory: 1Gi
                limits:
                  cpu: "1"
                  memory: 2Gi
