apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      serviceAccountName: admin
      terminationGracePeriodSeconds: 40
      containers:
        - name: admin
          image: palladium/admin
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: palladium-secrets
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              # node:22-alpine has busybox sleep, so the exec hook works here
              # (unlike commerce's distroless image).
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: "200m"
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
