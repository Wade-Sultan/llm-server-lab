apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-config
data:
  BACKEND_API_URL: "http://builder"
  # Public GCS bucket holding blog cover images and in-post images. Written by
  # the admin's /api/blog/upload route using the palladium-admin GSA (Workload
  # Identity — see deploy/overlays/prod/patches/workload-identity.yaml), and
  # read directly by browsers from storage.googleapis.com.
  #
  # Not a secret: the bucket is public-read by design, and the name appears in
  # every image URL on the blog. Overridden per overlay if a separate bucket is
  # ever wanted for local authoring.
  #
  # If this key is absent the upload route returns a 400 explaining it is
  # unconfigured — posting still works, image upload does not.
  BLOG_MEDIA_BUCKET: "palladium-blog-media"
  # Public GCS bucket holding part product images — currently the case photos
  # the build flow's case picker renders. Written by /api/parts/upload through
  # the same GSA as the blog bucket, read directly by browsers.
  #
  # Separate from the blog bucket because the two have different lifecycles: a
  # blog image belongs to one post, a part image is catalog data that outlives
  # any post and is served on every build that recommends the part. Falls back
  # to BLOG_MEDIA_BUCKET (under a `parts/` prefix) when unset, so the upload
  # route works before this bucket exists.
  PARTS_MEDIA_BUCKET: "palladium-parts-media"
