apiVersion: v1
kind: ConfigMap
metadata:
  name: builder-config
# Only environment-independent values live here. The overlay patches in
# ENVIRONMENT, POSTGRES_SERVER, POSTGRES_DB, FRONTEND_HOST,
# BACKEND_CORS_ORIGINS and FIREBASE_PROJECT_ID. Anything carrying a credential
# — POSTGRES_PASSWORD, POSTGRES_DB_URL (embeds the password), API keys — goes
# in palladium-secrets.
#
# POSTGRES_DB is per-overlay on purpose: local is `palladium_local` and prod is
# `palladium`, so a connection string (or a psql prompt) says out loud which
# database it is attached to. Both being `palladium` is how you end up running
# a scratch query against Cloud SQL.
data:
  PROJECT_NAME: "Palladium"
  LOG_LEVEL: "INFO"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "palladium_app"
  # LangSmith trace destination. The key itself is LANGSMITH_API_KEY in
  # palladium-secrets; with no key the exporter is simply not attached, so an
  # unconfigured cluster traces to Google Cloud only rather than failing.
  #
  # Note there is no OTEL_EXPORTER_OTLP_ENDPOINT here on purpose: Managed
  # OpenTelemetry for GKE injects it into these Pods via its Instrumentation
  # custom resource, and a value set here would override an injection that is
  # meant to win. See app/core/tracing.py.
  LANGSMITH_PROJECT: "palladium"
  # Commerce's in-cluster address, used by the pricing ETL to have price-drop
  # emails sent (commerce is the only service holding RESEND_API_KEY). The bare
  # Service name resolves within the namespace, so this is the same in every
  # overlay. The shared secret that goes with it is COMMERCE_INTERNAL_KEY in
  # palladium-secrets — commerce reads the same value as INTERNAL_API_KEY.
  COMMERCE_INTERNAL_URL: "http://commerce"
  # Whether a price drop actually mails anyone. Off everywhere for now: the
  # pricing ETL still evaluates every subscription and logs what it would have
  # sent, but nothing is delivered and no subscription is retired, so turning
  # this on later alerts exactly the people it would have alerted while off.
  # There is no frontend for subscribing yet either.
  PRICE_ALERTS_ENABLED: "false"
