apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: builder
spec:
  # No hostname here on purpose: hostnames are per-environment and live on the
  # Gateway's listeners (local overlay vs GKE). sectionName pins this route to
  # the `api` listener, so the pairing survives hostname changes.
  parentRefs:
    - name: palladium
      sectionName: api
  rules:
    - backendRefs:
        - name: builder
          port: 80
# The SSE timeout is NOT here, because the two controllers disagree about how to
# express it and this file has to be valid for both.
#
# The /chat stream must outlive _DSPY_CHAT_TIMEOUT_S (180s) or the proxy cuts a
# long build off mid-stream — that requirement is environment-independent, but
# the mechanism is not:
#
#   local  overlays/local/patches/httproute-timeout.yaml  (Cilium honours
#          HTTPRoute timeouts.request; verified in the generated Envoy config)
#   prod   overlays/prod/backend-policies.yaml            (GCPBackendPolicy
#          timeoutSec; the GKE controller REJECTS timeouts.request outright with
#          "Error GWCER104: ... timeouts are not supported", and one bad route
#          invalidates the entire Gateway — not just that route)
