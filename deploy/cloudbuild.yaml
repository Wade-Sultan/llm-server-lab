# GKE deploy pipeline, and the only one. It replaced three per-service pipelines
# (two Cloud Run, one GCE) with a single build that ships all three images and
# gates the rollout on a migration; those files and the services they deployed
# to are gone. If a Cloud Build trigger still references them it will fail on a
# missing config — delete the trigger rather than restoring the file.
#
# Manual run — $SHORT_SHA is only populated for trigger-driven builds, so pass
# it explicitly or every image lands on the same tag:
#
#   gcloud builds submit --config=deploy/cloudbuild.yaml \
#     --substitutions=SHORT_SHA=$(git rev-parse --short HEAD)
#
# NOTE ON $$: Cloud Build resolves `$FOO` as a substitution and errors on names
# it does not know, so every *shell* variable below is written `$$FOO`, which it
# emits as a literal `$FOO`. Single-$ names are Cloud Build's own
# ($PROJECT_ID, $SHORT_SHA, $_REGION, ...). Getting this backwards is the classic
# way this file fails on the very first step.
#
# KUBECONFIG lives in /workspace so one get-credentials is shared by every later
# step; $HOME does not persist between steps, /workspace does.

# NOTE: there is deliberately no _IMG here. It used to be
#   _IMG: us-central1-docker.pkg.dev/$PROJECT_ID/palladium
# which nests one substitution inside another's value. That expansion is not
# reliable — a manual `gcloud builds submit` shipped the literal string
# "$PROJECT_ID" through to bash, where `set -u` killed every build step with
# "PROJECT_ID: unbound variable". Setting options.dynamicSubstitutions did not
# fix it. Referencing $PROJECT_ID directly in step args, as below, always
# resolves, so the registry path is spelled out at each use instead.
substitutions:
  _REGION: us-central1
  _CLUSTER: palladium
  _NAMESPACE: palladium
  _REPO: palladium
  _OVERLAY: deploy/overlays/prod

options:
  # Required when the build runs as a user-specified service account.
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 3600s

steps:
  # ---------------------------------------------------------------- build ----
  # All three build in parallel (waitFor: ['-']). --cache-from needs the tag
  # locally first, and `|| true` keeps the very first build — when no :latest
  # exists yet — from failing.
  - id: build-builder
    name: gcr.io/cloud-builders/docker
    dir: backend
    entrypoint: bash
    waitFor: ['-']
    env: ['DOCKER_BUILDKIT=1']
    args:
      - -c
      - |
        set -euo pipefail
        # $PROJECT_ID / $_REGION / $_REPO are Cloud Build substitutions and are
        # replaced before bash runs; $$IMG is the shell variable they build.
        IMG="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend"
        docker pull "$$IMG:latest" || true
        docker build \
          --cache-from "$$IMG:latest" \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -t "$$IMG:$SHORT_SHA" \
          -t "$$IMG:latest" .

  - id: build-commerce
    name: gcr.io/cloud-builders/docker
    dir: commerce
    entrypoint: bash
    waitFor: ['-']
    env: ['DOCKER_BUILDKIT=1']
    args:
      - -c
      - |
        set -euo pipefail
        # $PROJECT_ID / $_REGION / $_REPO are Cloud Build substitutions and are
        # replaced before bash runs; $$IMG is the shell variable they build.
        IMG="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/commerce"
        docker pull "$$IMG:latest" || true
        docker build \
          --cache-from "$$IMG:latest" \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -t "$$IMG:$SHORT_SHA" \
          -t "$$IMG:latest" .

  - id: build-admin
    name: gcr.io/cloud-builders/docker
    dir: admin
    entrypoint: bash
    waitFor: ['-']
    env: ['DOCKER_BUILDKIT=1']
    args:
      - -c
      - |
        set -euo pipefail
        # $PROJECT_ID / $_REGION / $_REPO are Cloud Build substitutions and are
        # replaced before bash runs; $$IMG is the shell variable they build.
        IMG="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/admin"
        docker pull "$$IMG:latest" || true
        docker build \
          --cache-from "$$IMG:latest" \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -t "$$IMG:$SHORT_SHA" \
          -t "$$IMG:latest" .

  # ----------------------------------------------------------------- push ----
  - id: push-builder
    name: gcr.io/cloud-builders/docker
    waitFor: [build-builder]
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend']

  - id: push-commerce
    name: gcr.io/cloud-builders/docker
    waitFor: [build-commerce]
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/commerce']

  - id: push-admin
    name: gcr.io/cloud-builders/docker
    waitFor: [build-admin]
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/admin']

  # --------------------------------------------------------------- render ----
  # Runs in parallel with the image builds — it only touches text.
  #
  # cloud-sdk rather than the kubectl builder because this step needs python3
  # as well as kubectl, and cloud-sdk is guaranteed to have both (gcloud itself
  # is a python application).
  #
  # sed rather than `kustomize edit set image`: the substitution is two fields,
  # and the \b boundaries keep FIREBASE_PROJECT_ID from being rewritten, which
  # an unanchored match would corrupt into a value nothing resolves.
  - id: render
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    waitFor: ['-']
    args:
      - -c
      - |
        set -euo pipefail
        cd "$_OVERLAY"

        # keda-worker.yaml is in this list because the KEDA trigger queries
        # Cloud Monitoring by project-scoped URL. Left unsubstituted it does not
        # fail — it silently polls a project named "PROJECT_ID", so the workers
        # never scale and nothing anywhere says why.
        sed -i "s/\bPROJECT_ID\b/$PROJECT_ID/g" \
          kustomization.yaml patches/workload-identity.yaml keda-worker.yaml
        sed -i "s/newTag: latest/newTag: $SHORT_SHA/g" kustomization.yaml

        # Fail loudly rather than deploying a half-substituted manifest.
        if grep -qE '\bPROJECT_ID\b|newTag: latest' kustomization.yaml keda-worker.yaml; then
          echo "ERROR: substitution incomplete" >&2
          grep -nE '\bPROJECT_ID\b|newTag: latest' kustomization.yaml keda-worker.yaml >&2
          exit 1
        fi
        # POSTGRES_SERVER is intentionally not in this ConfigMap — it is the Cloud
        # SQL private IP and lives in palladium-secrets-builder so it never gets
        # committed. Guard against someone re-adding it, which would both leak
        # the address and shadow nothing (the Secret would still win, silently
        # diverging from what the repo appears to say).
        if grep -qE '^ *POSTGRES_SERVER:' patches/config-prod.yaml; then
          echo "ERROR: POSTGRES_SERVER must not be in config-prod.yaml — it belongs in" >&2
          echo "       palladium-secrets-builder (RUNBOOK §7). Remove it." >&2
          exit 1
        fi

        kubectl kustomize . > /workspace/manifests.yaml

        # Split the migration Job from everything else: it must complete BEFORE
        # the Deployments roll, so it cannot ride along in the same apply.
        # Splitting on document separators needs no YAML parser — kustomize
        # output is canonical, exactly one "---" line between documents.
        python3 - <<'PY'
        import re
        docs = open('/workspace/manifests.yaml').read().split('\n---\n')
        is_job = lambda d: re.search(r'^kind: Job$', d, re.M)
        open('/workspace/migrate.yaml', 'w').write('\n---\n'.join(d for d in docs if is_job(d)))
        open('/workspace/rest.yaml', 'w').write('\n---\n'.join(d for d in docs if not is_job(d)))
        PY

        test -s /workspace/migrate.yaml || { echo "ERROR: no migration Job rendered" >&2; exit 1; }
        test -s /workspace/rest.yaml    || { echo "ERROR: nothing else rendered" >&2; exit 1; }

        # Job specs are immutable, so re-applying `migrate` with a new image
        # fails. The SHA suffix sidesteps that and leaves a legible record of
        # which commit ran which migration.
        sed -i "s/^  name: migrate\$/  name: migrate-$SHORT_SHA/" /workspace/migrate.yaml
        grep -m1 '^  name: migrate-' /workspace/migrate.yaml

  # ----------------------------------------------------------------- auth ----
  - id: credentials
    name: gcr.io/cloud-builders/kubectl
    entrypoint: bash
    waitFor: [render]
    env: ['KUBECONFIG=/workspace/kubeconfig']
    args:
      - -c
      - |
        set -euo pipefail
        gcloud container clusters get-credentials "$_CLUSTER" --region "$_REGION"

        # Preflight. These Secrets are created out-of-band, so the
        # repo cannot verify them — but deploying without them means three pods
        # crash-looping on missing env, which reads like an application bug.
        for s in builder commerce admin; do
          kubectl -n "$_NAMESPACE" get secret "palladium-secrets-$$s" >/dev/null \
            || { echo "ERROR: secret palladium-secrets-$$s missing (RUNBOOK §7)" >&2; exit 1; }
        done

        # VALKEY_HOST is a WARNING, not an error. Its absence is a valid (if
        # degraded) configuration: /chat falls back to running turns inline, and
        # failing the rollout would take a working API down over a missing
        # optional dependency. But the worker Deployment cannot do anything
        # useful without it, so say so loudly.
        kubectl -n "$_NAMESPACE" get secret palladium-secrets-builder \
          -o jsonpath='{.data.VALKEY_HOST}' 2>/dev/null | grep -q . \
          || echo "WARNING: VALKEY_HOST missing from palladium-secrets-builder — /chat will run turns inline and they will not survive client disconnect (deploy/messaging.md §1)" >&2

        # OPENAI_API_KEY, same shape as VALKEY_HOST: a WARNING, because every
        # read path degrades to "no semantic matches" without erroring and the
        # build pipeline runs exactly as it did before pgvector existed. But the
        # embeddings CronJob exits 1 without it, so an unnoticed absence shows
        # up as a nightly red job and a permanently empty embeddings table.
        kubectl -n "$_NAMESPACE" get secret palladium-secrets-builder \
          -o jsonpath='{.data.OPENAI_API_KEY}' 2>/dev/null | grep -q . \
          || echo "WARNING: OPENAI_API_KEY missing from palladium-secrets-builder — the embeddings CronJob will fail and catalog matching stays disabled" >&2

        # The price-alert shared secret is ONE value under two names: the
        # builder sends COMMERCE_INTERNAL_KEY, commerce checks INTERNAL_API_KEY.
        # Compared rather than merely present-checked, because drift between
        # them is silent — the pricing ETL just collects 403s and the
        # subscriptions sit active forever. A WARNING, not an error: alerts are
        # off by default (PRICE_ALERTS_ENABLED), so nothing is broken today.
        AK=$$(kubectl -n "$_NAMESPACE" get secret palladium-secrets-builder \
                -o jsonpath='{.data.COMMERCE_INTERNAL_KEY}' 2>/dev/null || true)
        CK=$$(kubectl -n "$_NAMESPACE" get secret palladium-secrets-commerce \
                -o jsonpath='{.data.INTERNAL_API_KEY}' 2>/dev/null || true)
        if [ -z "$$AK" ] || [ -z "$$CK" ]; then
          echo "WARNING: the price-alert shared secret is not set on both sides (COMMERCE_INTERNAL_KEY in palladium-secrets-builder, INTERNAL_API_KEY in palladium-secrets-commerce) — price-drop emails cannot be sent" >&2
        elif [ "$$AK" != "$$CK" ]; then
          echo "ERROR: COMMERCE_INTERNAL_KEY (builder) and INTERNAL_API_KEY (commerce) differ — they are the same shared secret and every price alert would be rejected with a 403" >&2
          exit 1
        fi

        # POSTGRES_SERVER lives only in the Secret. Validate the actual value:
        # a pasted-in placeholder or an empty host fails at runtime as DNS or
        # connection errors, which is far more expensive to diagnose than here.
        PG_HOST=$$(kubectl -n "$_NAMESPACE" get secret palladium-secrets-builder \
          -o jsonpath='{.data.POSTGRES_SERVER}' | base64 -d)
        # Each RFC1918 range spells out its own four octets. The previous form
        # shared one trailing `[0-9]+\.[0-9]+$` across all three alternatives,
        # which only works when the prefix consumed two octets: `172.16.` and
        # `192.168.` did, but bare `10.` consumes one. The result was exactly
        # inverted for the 10/8 range — it rejected every real address like
        # 10.0.16.3 while happily accepting the truncated `10.0.16`.
        if ! echo "$$PG_HOST" | grep -qE '^(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3})$'; then
          echo "ERROR: POSTGRES_SERVER in palladium-secrets-builder is not a private IP" >&2
          echo "       (got '$$PG_HOST') — see RUNBOOK §7" >&2
          exit 1
        fi

        # The DB connection URLs have been the most error-prone value in this
        # whole migration, failing twice in ways that only surface at runtime:
        #   ...@:5432/palladium          empty host (an unset shell variable)
        #   ...@['10.0.16.3']:5432/...   a gcloud list projection pasted verbatim
        # Both are valid *strings*, so nothing upstream objects; they then fail in
        # three libraries with three unrelated messages (pydantic "empty host",
        # pgx "invalid host", Prisma "invalid IPv6 address"). Assert the shape
        # here, where the error names the actual problem.
        for pair in builder:POSTGRES_DB_URL commerce:DATABASE_URL admin:DATABASE_URL; do
          S=$${pair%%:*}; K=$${pair##*:}
          U=$$(kubectl -n "$_NAMESPACE" get secret "palladium-secrets-$$S" \
                 -o jsonpath="{.data.$$K}" | base64 -d)
          # host must be bare: letters/digits/dots/dashes only, then :port/db
          if ! echo "$$U" | grep -qE '^postgresql://[^:/@]+:[^@]*@[0-9A-Za-z.-]+:[0-9]+/[^?]+'; then
            echo "ERROR: palladium-secrets-$$S/$$K is not a usable Postgres URL." >&2
            echo "       host is empty or malformed — see RUNBOOK §7" >&2
            exit 1
          fi
        done
        echo "preflight OK"

  # -------------------------------------------------------------- migrate ----
  # The rollout gate. `create`, not `apply`: the name is unique per commit so
  # there is nothing to merge.
  #
  # RE-RUNNING THE SAME COMMIT IS NORMAL, and the step is built for it. A build
  # that fails at `deploy` or `rollout` leaves a completed migrate Job behind for
  # ttlSecondsAfterFinished (1h), so a bare `create` would answer the retry with
  # `AlreadyExists` — blocking a retry over a step that had already succeeded.
  # Hence the three-way check below rather than create-and-hope:
  #
  #   already succeeded  skip. The schema is at this commit; `alembic upgrade
  #                      head` would be a no-op anyway, and re-running it would
  #                      only re-acquire the migration lock for nothing.
  #   already failed     fail loudly, with logs. Deliberately NOT retried: the
  #                      failure is deterministic, and silently re-running it
  #                      would bury the real error under a second identical one.
  #   still running      a concurrent build owns it. Wait on that Job rather than
  #                      racing a second `alembic upgrade head` against it.
  #
  # The two competing waits exist because `kubectl wait --for=condition=complete`
  # does NOT return when a Job fails — it blocks until the timeout expires.
  # Waiting on `failed` in parallel and taking whichever resolves first turns a
  # 15-minute hang into an immediate, correctly-attributed failure.
  - id: migrate
    name: gcr.io/cloud-builders/kubectl
    entrypoint: bash
    waitFor: [credentials, push-builder]
    env: ['KUBECONFIG=/workspace/kubeconfig']
    args:
      - -c
      - |
        set -euo pipefail
        JOB="migrate-$SHORT_SHA"

        dump_logs() {
          echo "--- migration diagnostics ---" >&2
          kubectl -n "$_NAMESPACE" logs "job/$$JOB" --tail=200 --all-containers >&2 || true
          kubectl -n "$_NAMESPACE" describe "job/$$JOB" >&2 || true
        }

        if kubectl -n "$_NAMESPACE" get "job/$$JOB" >/dev/null 2>&1; then
          # jsonpath yields an empty string, not 0, for an unset counter — hence
          # the :-0 defaults, without which `[ -ge ]` errors on empty input.
          SUCCEEDED=$$(kubectl -n "$_NAMESPACE" get "job/$$JOB" \
            -o jsonpath='{.status.succeeded}' 2>/dev/null || true)
          FAILED=$$(kubectl -n "$_NAMESPACE" get "job/$$JOB" \
            -o jsonpath='{.status.failed}' 2>/dev/null || true)

          if [ "$${SUCCEEDED:-0}" -ge 1 ] 2>/dev/null; then
            echo "migration $$JOB already completed for this commit; skipping"
            exit 0
          fi

          if [ "$${FAILED:-0}" -ge 1 ] 2>/dev/null; then
            # A failed Job is two different situations wearing the same status,
            # and they want opposite handling:
            #
            #   alembic ran and raised    Deterministic. Block — the schema is in
            #                             an unknown state and rolling code onto
            #                             it is the outage this gate prevents.
            #   the pod never ran         ImagePullBackOff (this step waits on
            #                             push-builder, so a slow push does it),
            #                             eviction, nothing schedulable. Nothing
            #                             touched the database. Retryable.
            #
            # A terminated container state is the discriminator: it exists only
            # if the container actually started and exited.
            PODS=$$(kubectl -n "$_NAMESPACE" get pods -l "job-name=$$JOB" \
              -o name 2>/dev/null | wc -l)
            EXIT_CODES=$$(kubectl -n "$_NAMESPACE" get pods -l "job-name=$$JOB" \
              -o jsonpath='{.items[*].status.containerStatuses[*].state.terminated.exitCode}' \
              2>/dev/null || true)

            # FAILS CLOSED. Pods are garbage collected, and once they are gone
            # "no terminated container" is indistinguishable from "never ran" —
            # so absent pods block rather than retry. Guessing wrong in this
            # direction costs a manual delete; the other direction deploys onto
            # a half-migrated database.
            if [ "$$PODS" -gt 0 ] && [ -z "$$EXIT_CODES" ]; then
              echo "migration $$JOB failed before alembic started (no container ever" >&2
              echo "terminated) — infrastructure, not a migration. Recreating it." >&2
              kubectl -n "$_NAMESPACE" delete job "$$JOB" --wait=true
              kubectl -n "$_NAMESPACE" create -f /workspace/migrate.yaml
            else
              echo "ERROR: migration $$JOB already ran for this commit and FAILED" >&2
              echo "       (container exit code(s): $${EXIT_CODES:-unknown})." >&2
              echo "       Re-running would reproduce it. Fix the migration, then either" >&2
              echo "       commit the fix (new SHA) or clear the Job to retry this one:" >&2
              echo "         kubectl -n $_NAMESPACE delete job $$JOB" >&2
              dump_logs
              exit 1
            fi
          fi

          echo "migration $$JOB is already in flight (concurrent build?); waiting on it"
        else
          kubectl -n "$_NAMESPACE" create -f /workspace/migrate.yaml
        fi

        trap dump_logs ERR

        kubectl -n "$_NAMESPACE" wait --for=condition=complete --timeout=900s "job/$$JOB" &
        ok=$$!
        ( kubectl -n "$_NAMESPACE" wait --for=condition=failed --timeout=900s "job/$$JOB" && exit 1 ) &
        bad=$$!

        wait -n "$$ok" "$$bad"
        kill "$$ok" "$$bad" 2>/dev/null || true

        echo "migration $$JOB complete"
        kubectl -n "$_NAMESPACE" logs "job/$$JOB" --tail=50 --all-containers || true

  # --------------------------------------------------------------- deploy ----
  - id: deploy
    name: gcr.io/cloud-builders/kubectl
    entrypoint: bash
    waitFor: [migrate, push-commerce, push-admin]
    env: ['KUBECONFIG=/workspace/kubeconfig']
    args:
      - -c
      - |
        set -euo pipefail
        kubectl apply -f /workspace/rest.yaml

  # --------------------------------------------------------------- verify ----
  # maxUnavailable: 0 means old pods keep serving until new ones are ready, so a
  # failed rollout is a stalled deploy rather than an outage. Failing the build
  # here is what makes that visible instead of silently timing out.
  - id: rollout
    name: gcr.io/cloud-builders/kubectl
    entrypoint: bash
    waitFor: [deploy]
    env: ['KUBECONFIG=/workspace/kubeconfig']
    args:
      - -c
      - |
        set -euo pipefail
        for d in builder worker commerce admin; do
          kubectl -n "$_NAMESPACE" rollout status "deployment/$$d" --timeout=600s
        done

        PROGRAMMED=$$(kubectl -n "$_NAMESPACE" get gateway palladium \
          -o jsonpath='{.status.conditions[?(@.type=="Programmed")].status}' 2>/dev/null || true)
        [ "$$PROGRAMMED" = "True" ] || echo "WARNING: Gateway not Programmed (got '$$PROGRAMMED')" >&2

# Images are pushed by explicit steps rather than an `images:` block, because
# that block only pushes after every step succeeds — which would mean the
# migration ran against images that were never published.
