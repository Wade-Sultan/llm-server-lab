[project]
name = "app"
version = "0.1.0"
description = ""
# Floor of 3.12: see the note in Dockerfile. The ceiling is litellm's (<3.14),
# reached transitively through dspy.
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]<1.0.0,>=0.114.2",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "tenacity<9.0.0,>=8.2.3",
    "pydantic>2.0",
    "alembic<2.0.0,>=1.12.1",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary]<4.0.0,>=3.1.13",
    "sqlmodel<1.0.0,>=0.0.21",
    "pydantic-settings>=2.2.1,<3.0.0",
    "sentry-sdk[fastapi]<2.0.0,>=1.40.6",
    "openai>=1.0.0",
    "python-dotenv>=1.0.1",
    "alembic-postgresql-enum>=1.0.0",
    "cloud-sql-python-connector[pg8000,asyncpg]>=1.20.1",
    "pg8000>=1.31.5",
    "asyncpg>=0.29.0",
    "firebase-admin>=7.3.0",
    "dspy-ai>=3.2.1",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0.35",
    # Capped below 8.0: that release requires starlette>=1.0, which cannot be
    # satisfied alongside fastapi<1.0 (it pins starlette<0.42).
    "prometheus-fastapi-instrumentator>=7.1.0,<8.0.0",
    # Discovery pipeline — lazy-imported inside app/services/discovery/ only,
    # so the API's startup path never pays for them.
    "trafilatura>=1.12",
    "pypdfium2>=4.30",
    "Pillow>=10.0",
    "rapidfuzz>=3.9",
    # Valkey speaks the Redis wire protocol, so redis-py is the supported client
    # — there is no separate valkey package to install. 5.0 is the floor for
    # asyncio RedisCluster, which Memorystore for Valkey requires.
    "redis>=5.0",
    "google-cloud-pubsub>=2.21",
    # Chat turn harness. langgraph-checkpoint carries BaseCheckpointSaver and
    # JsonPlusSerializer, which app/services/graph/checkpoint.py implements
    # against directly — langgraph-checkpoint-redis is deliberately NOT here,
    # because it requires the RedisJSON and RediSearch modules and Memorystore
    # for Valkey ships no modules at all.
    "langgraph>=0.2.60",
    "langgraph-checkpoint>=2.0.24",
    # Emits the graph's spans through OpenTelemetry rather than LangSmith's
    # native REST transport (see LANGSMITH_TRACING_MODE in app/core/tracing.py).
    "langsmith[otel]>=0.2.0",
    # opentelemetry-api/-sdk arrive transitively via dspy; the exporter and the
    # openai instrumentor do not, and both are needed on the tracing path.
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-openai-v2>=2.0b0",
    # The non-LLM half of the trace, and the only half Google gets that
    # LangSmith does not — the scope filter in app/core/tracing.py drops every
    # one of these. Managed OTel for GKE injects a collector endpoint but does
    # NOT auto-instrument Python, so without these packages the Google pipe
    # carries nothing but the same LLM spans LangSmith already has.
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.2",
    "langchain-openrouter>=0.2.7",
    "assistant-stream>=0.0.36",
    "pgvector>=0.3.6",
]

[dependency-groups]
dev = [
    "pytest<8.0.0,>=7.4.3",
    "mypy<2.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.2.2",
    "pre-commit<4.0.0,>=3.6.2",
    "coverage<8.0.0,>=7.4.3",
]

# NO locust GROUP HERE, deliberately — see deploy/loadtest/requirements.txt.
# locust >=2.46 requires pytest>=8.3.3 and `dev` above pins pytest<8.0.0, so uv
# (which locks every group together) cannot satisfy both. The load test is not
# part of this package and is not imported by it, so it gets its own
# environment rather than dragging this one's test stack forward.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py312"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.per-file-ignores]
# Model re-exports. These imports look unused because nothing references the
# names here — but importing them is the point: it is what registers each model
# with SQLAlchemy's metadata. Delete them and `alembic revision --autogenerate`
# quietly stops seeing those tables, which produces an empty migration rather
# than an error. The same applies to the crud package's aggregator.
"app/models/__init__.py" = ["F401"]
"app/crud/__init__.py" = ["F401"]

# Seed scripts are run by hand and print their progress; that is their whole
# interface. The T201 ban exists so print() never sneaks into request-handling
# code, which is a different situation.
"app/seeds/*" = ["T201"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true
