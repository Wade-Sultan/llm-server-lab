steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/palladium/backend:$BUILD_ID'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/palladium/backend:latest'
      - '.'
    dir: 'backend'
    env:
      - 'DOCKER_BUILDKIT=1'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/palladium/backend'

  # Migrations run once per deploy, here — not on container startup. Deployed
  # and executed before the service below so a failed migration aborts the
  # build and the old revision keeps serving. Reuses the backend image; only
  # the command differs.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'palladium-migrate'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/palladium/backend:$BUILD_ID'
      - '--region=us-central1'
      - '--command=alembic'
      - '--args=upgrade,head'
      - '--set-cloudsql-instances=$PROJECT_ID:us-central1:palladium-db'
      - '--service-account=palladium-backend@$PROJECT_ID.iam.gserviceaccount.com'
      # OPENROUTER_API_KEY and SERPAPI_KEY are irrelevant to a migration, but
      # alembic/env.py imports app.core.config, and Settings declares both
      # without a default — so constructing it fails without them. Keep this
      # list in sync with the service below.
      - '--set-secrets=POSTGRES_PASSWORD=palladium-db-password-prod:latest,OPENROUTER_API_KEY=openrouter-api-key:latest,SERPAPI_KEY=serpapi-key:latest'
      - '--set-env-vars=^|^ENVIRONMENT=production|PROJECT_NAME=Palladium|POSTGRES_USER=palladium_app|POSTGRES_DB=palladium|CLOUD_SQL_INSTANCE=$PROJECT_ID:us-central1:palladium-db|POSTGRES_SERVER=ignored|POSTGRES_PORT=5432'
      - '--max-retries=0'
      - '--task-timeout=900'

  # --wait makes a non-zero exit here fail the build, so a bad migration never
  # reaches the service deploy step. --max-retries=0 above keeps a half-applied
  # migration from being retried on top of itself.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'palladium-migrate'
      - '--region=us-central1'
      - '--wait'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'palladium-backend'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/palladium/backend:$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--port=8000'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=$PROJECT_ID:us-central1:palladium-db'
      - '--service-account=palladium-backend@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-secrets=POSTGRES_PASSWORD=palladium-db-password-prod:latest,OPENROUTER_API_KEY=openrouter-api-key:latest,SERPAPI_KEY=serpapi-key:latest'
      - '--set-env-vars=^|^ENVIRONMENT=production|PROJECT_NAME=Palladium|FRONTEND_HOST=https://palladiumtech.ai|BACKEND_CORS_ORIGINS=https://palladiumtech.ai,https://www.palladiumtech.ai|POSTGRES_USER=palladium_app|POSTGRES_DB=palladium|CLOUD_SQL_INSTANCE=$PROJECT_ID:us-central1:palladium-db|POSTGRES_SERVER=ignored|POSTGRES_PORT=5432'
      - '--min-instances=0'
      - '--max-instances=4'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--cpu-boost'
      - '--timeout=300'
      - '--concurrency=80'
      - '--cpu-throttling'
      - '--session-affinity'

  # Pricing ETL: SerpAPI street-price checks, run daily by Cloud Scheduler
  # against this Job (scheduler trigger is set up manually — see runbook,
  # not tracked in this repo). Reuses the backend image built above; only the
  # container command differs.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'palladium-pricing-etl'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/palladium/backend:$BUILD_ID'
      - '--region=us-central1'
      - '--command=python'
      - '--args=-m,app.jobs.pricing_etl'
      - '--set-cloudsql-instances=$PROJECT_ID:us-central1:palladium-db'
      - '--service-account=palladium-backend@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-secrets=POSTGRES_PASSWORD=palladium-db-password-prod:latest,OPENROUTER_API_KEY=openrouter-api-key:latest,SERPAPI_KEY=serpapi-key:latest'
      - '--set-env-vars=^|^ENVIRONMENT=production|PROJECT_NAME=Palladium|POSTGRES_USER=palladium_app|POSTGRES_DB=palladium|CLOUD_SQL_INSTANCE=$PROJECT_ID:us-central1:palladium-db|POSTGRES_SERVER=ignored|POSTGRES_PORT=5432'
      - '--max-retries=1'
      - '--task-timeout=900'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/palladium/backend:$BUILD_ID'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/palladium/backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY