name: Test Backend

# `main`, not `master` — see the note in lint-backend.yml. This job had never
# run on a push, which is how three separate breakages below survived unnoticed.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest

    # app/core/config.py builds `settings` at import time from `../.env`, which
    # is gitignored and therefore does not exist on a runner. Five fields have no
    # default (PROJECT_NAME, POSTGRES_SERVER, POSTGRES_USER, OPENROUTER_API_KEY,
    # SERPAPI_KEY), so without this block every step that imports the app dies in
    # pydantic validation before a single test runs.
    #
    # NONE OF THESE ARE SECRETS, and that is the point rather than an oversight.
    # The two API keys are deliberate nonsense: the suite makes no outbound call
    # to either provider, so a real key would be a live credential sitting in a
    # public log for no test coverage in return. The Postgres values are the
    # throwaway container started below, whose credentials are already the
    # defaults committed in docker-compose.yml.
    #
    # `${{ secrets.* }}` would be worse here even if the values were real:
    # secrets are not exposed to workflows triggered by a fork's pull request, so
    # the gate would fail for exactly the contributors it exists to check.
    #
    # If a test ever genuinely needs a live key, give it its own job, mark it
    # `if: github.event.pull_request.head.repo.full_name == github.repository`,
    # and pull the key from secrets there — do not promote this block.
    env:
      PROJECT_NAME: Palladium
      # localhost, not `db`: these steps run on the runner itself, and compose
      # publishes 5432 to the host. `db` is the right answer only inside the
      # compose network, which is what docker-compose.yml's own prestart uses.
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: palladium_app
      POSTGRES_PASSWORD: changethis
      POSTGRES_DB: palladium
      POSTGRES_DB_URL: postgresql://palladium_app:changethis@localhost:5432/palladium
      OPENROUTER_API_KEY: ci-not-a-real-key
      SERPAPI_KEY: ci-not-a-real-key

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.4.15"
          enable-cache: true

      # Postgres for the suite, from the root compose file. Only `db` — the
      # template's `mailcatcher` service used to be named here and does not
      # exist in docker-compose.yml, so this step failed outright on any run
      # that reached it.
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d db

      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend

      - name: Run tests
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend

      - run: docker compose down -v --remove-orphans
        if: always()

      - name: Store coverage files
        uses: actions/upload-artifact@v6
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true

      # A RATCHET, NOT A TARGET. The inherited value was 90, against actual
      # coverage of ~46% — so this step failed every single run, which is
      # tolerable while nothing enforces the workflow and fatal the moment it
      # becomes a required check.
      #
      # 45 is set just under today's number: it blocks a regression without
      # blocking every PR. Raise it as coverage genuinely improves; do not raise
      # it aspirationally, because a permanently-red required check teaches
      # people to merge past CI, which costs more than the coverage was worth.
      - name: Coverage report
        run: uv run coverage report --fail-under=45
        working-directory: backend
