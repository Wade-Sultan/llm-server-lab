steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/palladium/commerce:$BUILD_ID'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/palladium/commerce:latest'
      - '.'
    dir: 'commerce'
    env:
      - 'DOCKER_BUILDKIT=1'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/palladium/commerce'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'palladium-commerce'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/palladium/commerce:$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--port=8080'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=$PROJECT_ID:us-central1:palladium-db'
      # This service account must exist ahead of the first deploy, with the
      # Cloud SQL Client IAM role granted, and must be registered as an IAM
      # database user on the palladium-db instance
      # (gcloud sql users create --type=cloud_iam_service_account) — commerce
      # authenticates to Postgres via Cloud SQL IAM auth, no password.
      - '--service-account=palladium-commerce@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-secrets=RESEND_API_KEY=resend-api-key:latest'
      - '--set-env-vars=^|^ENV=prod|FRONTEND_HOST=https://palladiumtech.ai|BACKEND_CORS_ORIGINS=https://palladiumtech.ai,https://www.palladiumtech.ai,http://localhost:3000|INSTANCE_CONNECTION_NAME=$PROJECT_ID:us-central1:palladium-db|DB_IAM_USER=palladium-commerce@$PROJECT_ID.iam|DB_NAME=palladium|DB_USE_PRIVATE_IP=false|FIREBASE_PROJECT_ID=$PROJECT_ID|EMAIL_FROM=Palladium <noreply@palladiumtech.ai>'
      - '--min-instances=0'
      - '--max-instances=4'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--timeout=60'
      - '--concurrency=80'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/palladium/commerce:$BUILD_ID'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/palladium/commerce:latest'

options:
  logging: CLOUD_LOGGING_ONLY
